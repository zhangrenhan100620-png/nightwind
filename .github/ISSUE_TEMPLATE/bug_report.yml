name: Bug report
description: Report reproducible incorrect Nightwind behavior.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private repository contents, personal data,
        or vulnerability details. Use SECURITY.md for suspected vulnerabilities.

  - type: input
    id: version
    attributes:
      label: Nightwind version or commit
      placeholder: 0.1.0a1 or a commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: macOS 15, Python 3.13
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a minimal public fixture or sanitized structure.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only sanitized output.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, and private repository content.
          required: true
        - label: This is not a vulnerability report.
          required: true
