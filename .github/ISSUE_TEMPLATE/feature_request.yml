name: Feature request
description: Propose a maintainable check or workflow improvement.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What recurring, observable problem should Nightwind solve?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence and remediation
      description: Describe an objective signal, likely false positives, and a concrete fix.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include why documentation or an existing tool is insufficient.
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal does not require executing code from the audited repository.
          required: true
        - label: Any proposed network transfer is explicit, minimized, and opt-in.
          required: true
